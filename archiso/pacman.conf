# pacman.conf - usado SOLO durante la construccion de la ISO (mkarchiso).
# Verificar contra /etc/pacman.conf de la maquina de build antes de usar en
# Fase 14 - los repos base (core/extra) son estables pero conviene confirmar.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
