# settings.conf - secuencia de modulos de Calamares para MEAL
# Basado en el patron probado de EndeavourOS (instalacion "online" via pacstrap,
# no una imagen squashfs pre-armada).
#
# Los modulos marcados [ESTANDAR] usan la config por defecto de Calamares,
# generada contra la version real instalada en la maquina de build (Fase 14),
# no inventada aqui. Los marcados [MEAL] son especificos de este proyecto.

modules-search: [ local, appdata ]

instances:
- id: meal_desktop_chooser
  module: packagechooser
  config: packagechooser-desktop.conf   # [MEAL]

sequence:
- show:
  - welcome              # [ESTANDAR]
  - locale               # [ESTANDAR]
  - keyboard              # [ESTANDAR]
  - partition             # [ESTANDAR]
  - packagechooser@meal_desktop_chooser   # [MEAL] elegir KDE/Hyprland/GNOME/XFCE
  - users                # [ESTANDAR]
  - summary               # [ESTANDAR]
- exec:
  - partition             # [ESTANDAR]
  - mount                 # [ESTANDAR]
  - pacstrap-meal          # [MEAL] instala segun perfil+escritorio elegido (ver modules/pacstrap-meal.conf)
  - machineid              # [ESTANDAR]
  - fstab                  # [ESTANDAR]
  - locale                 # [ESTANDAR]
  - keyboard                # [ESTANDAR]
  - localecfg                # [ESTANDAR]
  - users                    # [ESTANDAR]
  - networkcfg                # [ESTANDAR]
  - hwclock                    # [ESTANDAR]
  - services-systemd             # [ESTANDAR] + habilita servicios de scripts/desktop/*.conf
  - bootloader                    # [MEAL] Limine - contenido completo en Fase 7
  - umount                        # [ESTANDAR]
- show:
  - finished               # [ESTANDAR]

branding: meal
prompt-install: true
dont-chroot: false
