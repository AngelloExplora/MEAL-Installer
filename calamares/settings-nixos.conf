# settings-nixos.conf - secuencia de modulos para la variante NixOS de MEAL
# Separada de settings.conf (Arch) a proposito: NixOS no usa pacstrap ni
# Limine - usa nixos-install y declara su propio bootloader dentro de
# configuration.nix (confirmado en el codigo real de calamares-nixos-extensions).
#
# Probablemente se construya como su propia imagen ISO (ver nota de Fase 13),
# no como una opcion dentro de la ISO de Arch.

modules-search: [ local, appdata ]

instances:
- id: meal_desktop_chooser_nixos
  module: packagechooser
  config: packagechooser-desktop-nixos.conf   # [MEAL]

sequence:
- show:
  - welcome              # [ESTANDAR]
  - locale               # [ESTANDAR]
  - keyboard              # [ESTANDAR]
  - partition             # [ESTANDAR]
  - packagechooser@meal_desktop_chooser_nixos   # [MEAL] por ahora solo KDE Plasma
  - users                # [ESTANDAR]
  - summary               # [ESTANDAR]
- exec:
  - partition             # [ESTANDAR]
  - mount                 # [ESTANDAR]
  - nixos                  # [de calamares-nixos-extensions, NO escrito por nosotros]
  - nixos-customize-config  # [de calamares-nixos-extensions]
  - umount                 # [ESTANDAR]
- show:
  - finished               # [ESTANDAR]

branding: meal
prompt-install: true
dont-chroot: false
