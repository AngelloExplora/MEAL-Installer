# packagechooser-desktop.conf - eleccion de escritorio durante la instalacion
# Modulo nativo de Calamares (mismo que usa EndeavourOS Community Editions
# para elegir "edicion"), aqui usado para elegir el escritorio de MEAL.
#
# Los ids deben coincidir con los nombres de archivo en scripts/desktop/*.conf
# (Fase 5: por ahora solo "kde" existe; hyprland/gnome/xfce se agregan
# en sus fases correspondientes sin tocar este archivo mas que para sumar items).

mode: required
method: packages

items:
  - id: kde
    name: "KDE Plasma"
    description: "Escritorio completo, con Dolphin, Konsole y las herramientas basicas."
    screenshot: "kde.png"
  - id: hyprland
    name: "Hyprland"
    description: "Con HyDE y DankMaterialShell, estilo Omarchy pero sin ser Omarchy."
    screenshot: "hyprland.png"
  - id: niri
    name: "Niri"
    description: "Compositor con ventanas en scroll horizontal, con DankMaterialShell."
    screenshot: "niri.png"
  - id: mango
    name: "Mango"
    description: "Compositor ligero, con DankMaterialShell."
    screenshot: "mango.png"

default: kde
