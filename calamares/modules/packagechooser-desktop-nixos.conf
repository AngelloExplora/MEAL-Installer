# packagechooser-desktop-nixos.conf - escritorio para la variante NixOS
# Solo KDE Plasma por ahora: es la combinacion que el proyecto real de
# calamares-nixos-extensions ya probo (ISO "nixos-plasma5"). Hyprland/Niri/
# Mango bajo NixOS no estan confirmados - no se ofrecen todavia.

mode: required
method: packages

items:
  - id: plasma5
    name: "KDE Plasma"
    description: "Unica combinacion confirmada con el instalador de NixOS por ahora."
    screenshot: "kde.png"

default: plasma5
