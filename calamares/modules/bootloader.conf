# bootloader.conf - MEAL Boot (Limine) via shellprocess
# Calamares no soporta Limine nativamente (solo systemd-boot/GRUB2 documentados,
# confirmado en Fase 0) - se usa shellprocess para invocar nuestro propio script,
# mismo patron que EndeavourOS usa para su instalacion via pacstrap.

dontChroot: true
timeout: 300
script:
  - "scripts/boot/limine-install.sh"
